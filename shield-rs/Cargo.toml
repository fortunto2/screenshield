[package]
name = "shield"
version = "0.1.0"
edition = "2024"
description = "ScreenShield: DLP for video. Video is an untrusted channel. Fast loop on device, agent over the archive."
license = "MIT"

[[bin]]
name = "shield"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
chrono = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
sgr-agent = { path = "/Users/rustam/startups/shared/rust-code/crates/sgr-agent", default-features = false, features = ["openai", "oxide"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
